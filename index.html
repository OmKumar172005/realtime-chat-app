<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Chat App</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================
         NAME SCREEN
    ================================== -->

    <div
        id="name-screen"
        class="name-screen"
    >

        <div class="name-box">

            <h1>My Chat App</h1>

            <p>
                Enter your name to start chatting
            </p>

            <input
                type="text"
                id="username"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="off"
            >

            <button onclick="startChat()">
                Start Chat
            </button>

        </div>

    </div>



    <!-- =================================
         CHAT SCREEN
    ================================== -->

    <div
        class="chat-container"
        id="chat-container"
        style="display: none;"
    >


        <!-- =================================
             HEADER
        ================================== -->

        <div class="chat-header">

            <div class="header-title">

                <h1>
                    My Chat App
                </h1>

                <p id="online-status">
                    Connecting...
                </p>

            </div>


            <!-- Dark Mode -->

            <button
                id="theme-toggle"
                class="theme-toggle"
                onclick="toggleDarkMode()"
                title="Toggle dark mode"
            >
                🌙
            </button>

        </div>



        <!-- =================================
             CHAT MESSAGES
        ================================== -->

        <div id="chat-box"></div>



        <!-- =================================
             NEW MESSAGE BUTTON
        ================================== -->

        <button
            id="new-message-button"
            class="new-message-button"
            onclick="scrollToBottom()"
        >
            ↓ New message
        </button>



        <!-- =================================
             TYPING INDICATOR
        ================================== -->

        <div id="typing-indicator"></div>



        <!-- =================================
             INPUT AREA
        ================================== -->

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type a message..."
                maxlength="1000"
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>


    </div>



    <!-- =================================
         SOCKET.IO
    ================================== -->

    <script src="/socket.io/socket.io.js"></script>

    <script src="script.js"></script>


</body>

</html>
